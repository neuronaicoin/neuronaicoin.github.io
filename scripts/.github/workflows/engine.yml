name: NEURON Data Engine

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run engine
        run: node scripts/engine.js

      - name: Commit results
        run: |
          git config user.name "neuron-engine"
          git config user.email "actions@users.noreply.github.com"
          git add api/
          git diff --cached --quiet || git commit -m "engine: hourly scores update"
          git push
